{% extends 'base.html' %}{% block content %}<div class="card metric"><small>Purchase commitments</small><strong>{{money(total)}}</strong></div><section class="panel"><table><tr><th>PO</th><th>Vendor</th><th>Category</th><th>Project</th><th>Value</th><th>Approval</th><th>Delivery</th></tr>{% for x in rows %}<tr><td>{{x.po_no}}</td><td>{{x.vendor}}</td><td>{{x.category}}</td><td>{{x.project_department}}</td><td>{{money(x.value)}}</td><td>{{x.approval_status}}</td><td>{{x.delivery_status}}</td></tr>{% endfor %}</table></section>{% endblock %}

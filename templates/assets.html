{% extends 'base.html' %}{% block content %}<div class="grid"><div class="card metric"><small>Asset cost</small><strong>{{money(cost)}}</strong></div><div class="card metric"><small>Current value</small><strong>{{money(value)}}</strong></div></div><section class="panel"><table><tr><th>Asset</th><th>Category</th><th>Location</th><th>Custodian</th><th>Condition</th><th>Status</th></tr>{% for x in rows %}<tr><td>{{x.name}}</td><td>{{x.category}}</td><td>{{x.location}}</td><td>{{x.custodian}}</td><td>{{x.condition}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></section>{% endblock %}

{% extends 'base.html' %}{% block content %}<div class="grid"><div class="card metric"><small>Pipeline</small><strong>{{money(pipeline)}}</strong></div><div class="card metric"><small>Weighted</small><strong>{{money(weighted)}}</strong></div></div><section class="panel"><table><tr><th>Client</th><th>Opportunity</th><th>Owner</th><th>Stage</th><th>Value</th><th>Probability</th></tr>{% for x in rows %}<tr><td>{{x.client}}</td><td>{{x.opportunity}}</td><td>{{x.owner}}</td><td>{{x.stage}}</td><td>{{money(x.potential_value)}}</td><td>{{pct(x.probability)}}</td></tr>{% endfor %}</table></section>{% endblock %}

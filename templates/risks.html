{% extends 'base.html' %}{% block content %}<div class="card metric"><small>Critical / high risks</small><strong>{{critical}}</strong></div><section class="panel"><table><tr><th>ID</th><th>Area</th><th>Risk</th><th>Owner</th><th>Rating</th><th>Control</th></tr>{% for x in rows %}<tr><td>{{x.risk_id}}</td><td>{{x.area}}</td><td>{{x.risk}}</td><td>{{x.owner}}</td><td><span class="pill">{{x.rating}}</span></td><td>{{x.control_status}}</td></tr>{% endfor %}</table></section>{% endblock %}

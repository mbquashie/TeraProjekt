{% extends 'base.html' %}{% block content %}<div class="card metric"><small>Total hours</small><strong>{{total}}</strong></div><section class="panel"><table><tr><th>Date</th><th>Employee</th><th>Project</th><th>Activity</th><th>Hours</th><th>Status</th></tr>{% for x in rows %}<tr><td>{{ddate(x.work_date)}}</td><td>{{x.employee_name}}</td><td>{{x.project}}</td><td>{{x.activity}}</td><td>{{x.hours}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></section>{% endblock %}
